<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatterDocs Add-in</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <style>
        .email-info { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .attachment-list { margin: 10px 0; }
        .attachment-item { padding: 8px; border: 1px solid #ddd; margin: 5px 0; border-radius: 4px; }
        .button { background: #0078d4; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; margin: 5px; }
        .button:hover { background: #106ebe; }
        .loading { color: #666; font-style: italic; }
        .matter-select { width: 100%; padding: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <header>
        <h1>MatterDocs</h1>
    </header>
    <main>
        <div id="loading" class="loading">Loading email information...</div>
        
        <div id="email-content" style="display: none;">
            <div class="email-info">
                <h3>Current Email</h3>
                <div><strong>Subject:</strong> <span id="email-subject"></span></div>
                <div><strong>From:</strong> <span id="email-from"></span></div>
                <div><strong>Date:</strong> <span id="email-date"></span></div>
            </div>
            
            <div class="attachment-list">
                <h3>Attachments (<span id="attachment-count">0</span>)</h3>
                <div id="attachments-container"></div>
            </div>
            
            <div>
                <h3>Save to Matter</h3>
                <select id="matter-select" class="matter-select">
                    <option value="">Select a matter...</option>
                </select>
                
                <button class="button" onclick="saveEmail()">Save Email</button>
                <button class="button" onclick="saveSelectedAttachments()">Save Selected Attachments</button>
            </div>
            
            <div style="margin-top: 20px;">
                <a class="button" target="_blank" rel="noopener" href="/matters">Open MatterDocs</a>
            </div>
        </div>
    </main>
    
    <script>
        let currentEmail = {};
        let attachments = [];
        
        Office.onReady((info) => {
            console.log('Office.js ready:', info);
            if (info.host === Office.HostType.Outlook) {
                setTimeout(() => {
                    loadEmailInfo();
                    loadMatters();
                }, 500);
            } else {
                document.getElementById('loading').textContent = 'Not running in Outlook';
            }
        });
        
        function loadEmailInfo() {
            try {
                const item = Office.context.mailbox.item;
                console.log('Item:', item);
                
                // Get subject (synchronous property)
                const subject = item.subject || 'No subject';
                document.getElementById('email-subject').textContent = subject;
                currentEmail.subject = subject;
                
                // Get from (synchronous property)
                const from = item.from ? (item.from.displayName + ' <' + item.from.emailAddress + '>') : 'Unknown sender';
                document.getElementById('email-from').textContent = from;
                currentEmail.from = from;
                
                // Get date (synchronous property)
                const date = item.dateTimeCreated ? new Date(item.dateTimeCreated).toLocaleString() : 'Unknown date';
                document.getElementById('email-date').textContent = date;
                currentEmail.date = date;
                
                loadAttachments();
                
            } catch (error) {
                console.error('Error loading email info:', error);
                document.getElementById('loading').textContent = 'Error loading email: ' + error.message;
            }
        }
        
        function loadAttachments() {
            try {
                const item = Office.context.mailbox.item;
                attachments = item.attachments || [];
                
                console.log('Attachments found:', attachments.length);
                
                document.getElementById('attachment-count').textContent = attachments.length;
                
                const container = document.getElementById('attachments-container');
                container.innerHTML = '';
                
                if (attachments.length === 0) {
                    container.innerHTML = '<div class="attachment-item">No attachments found</div>';
                } else {
                    attachments.forEach((attachment, index) => {
                        const div = document.createElement('div');
                        div.className = 'attachment-item';
                        div.innerHTML = `
                            <input type="checkbox" id="att-${index}" checked>
                            <label for="att-${index}">
                                <strong>${attachment.name}</strong> (${formatFileSize(attachment.size || 0)})
                            </label>
                        `;
                        container.appendChild(div);
                    });
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('email-content').style.display = 'block';
                
            } catch (error) {
                console.error('Error loading attachments:', error);
                document.getElementById('loading').textContent = 'Error loading attachments: ' + error.message;
            }
        }
        
        function loadMatters() {
            fetch('/api/matters/list')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load matters');
                    }
                    return response.json();
                })
                .then(matters => {
                    const select = document.getElementById('matter-select');
                    matters.forEach(matter => {
                        const option = document.createElement('option');
                        option.value = matter.id;
                        option.textContent = `${matter.client_name} - ${matter.name}`;
                        select.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error loading matters:', error);
                    document.getElementById('matter-select').innerHTML = '<option value="">Error loading matters</option>';
                });
        }
        
        function saveEmail() {
            const matterId = document.getElementById('matter-select').value;
            if (!matterId) {
                alert('Please select a matter first');
                return;
            }
            
            try {
                Office.context.mailbox.item.body.getAsync(Office.CoercionType.Text, (result) => {
                    if (result.status === Office.AsyncResultStatus.Succeeded) {
                        const emailData = {
                            ...currentEmail,
                            body: result.value || 'No body content',
                            matterId: matterId
                        };
                        
                        fetch('/api/email/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(emailData)
                        })
                        .then(response => response.json())
                        .then(result => {
                            alert('Email saved successfully!');
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('Error saving email: ' + error.message);
                        });
                    } else {
                        console.error('Failed to get email body:', result.error);
                        alert('Failed to get email content');
                    }
                });
            } catch (error) {
                console.error('Error in saveEmail:', error);
                alert('Error: ' + error.message);
            }
        }
        
        function saveSelectedAttachments() {
            const matterId = document.getElementById('matter-select').value;
            if (!matterId) {
                alert('Please select a matter first');
                return;
            }
            
            const selectedAttachments = [];
            attachments.forEach((attachment, index) => {
                const checkbox = document.getElementById(`att-${index}`);
                if (checkbox && checkbox.checked) {
                    selectedAttachments.push(attachment);
                }
            });
            
            if (selectedAttachments.length === 0) {
                alert('Please select at least one attachment');
                return;
            }
            
            alert(`Processing ${selectedAttachments.length} attachment(s)...`);
            
            // Process each attachment
            selectedAttachments.forEach((attachment, index) => {
                try {
                    Office.context.mailbox.item.getAttachmentContentAsync(attachment.id, (result) => {
                        if (result.status === Office.AsyncResultStatus.Succeeded) {
                            const attachmentData = {
                                name: attachment.name,
                                content: result.value.content,
                                contentType: result.value.format,
                                matterId: matterId
                            };
                            
                            fetch('/api/attachments/save', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(attachmentData)
                            })
                            .then(response => response.json())
                            .then(result => {
                                console.log('Attachment saved:', attachment.name);
                                if (index === selectedAttachments.length - 1) {
                                    alert('All attachments saved successfully!');
                                }
                            })
                            .catch(error => {
                                console.error('Error saving attachment:', error);
                                alert('Error saving attachment: ' + attachment.name);
                            });
                        } else {
                            console.error('Failed to get attachment content:', result.error);
                            alert('Failed to get attachment: ' + attachment.name);
                        }
                    });
                } catch (error) {
                    console.error('Error processing attachment:', error);
                    alert('Error processing attachment: ' + attachment.name);
                }
            });
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
