<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatterDocs Add-in</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <style>
        .email-info { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .attachment-list { margin: 10px 0; }
        .attachment-item { padding: 8px; border: 1px solid #ddd; margin: 5px 0; border-radius: 4px; }
        .button { background: #0078d4; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; margin: 5px; }
        .button:hover { background: #106ebe; }
        .loading { color: #666; font-style: italic; }
        .matter-select { width: 100%; padding: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <header>
        <h1>MatterDocs</h1>
    </header>
    <main>
        <div id="loading" class="loading">Loading email information...</div>
        
        <div id="email-content" style="display: none;">
            <div class="email-info">
                <h3>Current Email</h3>
                <div><strong>Subject:</strong> <span id="email-subject"></span></div>
                <div><strong>From:</strong> <span id="email-from"></span></div>
                <div><strong>Date:</strong> <span id="email-date"></span></div>
            </div>
            
            <div class="attachment-list">
                <h3>Attachments (<span id="attachment-count">0</span>)</h3>
                <div id="attachments-container"></div>
            </div>
            
            <div>
                <h3>File to Matter</h3>
                
                <!-- Smart Matter Search -->
                <div style="position: relative;">
                    <input type="text" id="matter-search" placeholder="Search matters..." 
                           style="width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px;"
                           oninput="searchMatters()" onfocus="showMatterDropdown()">
                    <div id="matter-dropdown" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ddd; border-radius: 4px; max-height: 150px; overflow-y: auto; z-index: 1000;"></div>
                </div>
                
                <!-- Quick Matter Creation -->
                <div style="text-align: center; margin: 10px 0;">
                    <button class="button" onclick="toggleNewMatterForm()" style="background: #28a745; font-size: 12px; padding: 5px 10px;">+ New Matter</button>
                </div>
                
                <!-- New Matter Form -->
                <div id="new-matter-form" style="display: none; background: #f8f9fa; padding: 10px; border-radius: 4px; margin: 10px 0;">
                    <h4 style="margin: 0 0 10px 0;">Create New Matter</h4>
                    <input type="text" id="client-name" placeholder="Client Name" style="width: 100%; padding: 6px; margin: 3px 0; border: 1px solid #ddd; border-radius: 3px;">
                    <input type="text" id="matter-name" placeholder="Matter Name" style="width: 100%; padding: 6px; margin: 3px 0; border: 1px solid #ddd; border-radius: 3px;">
                    <div style="text-align: center; margin-top: 10px;">
                        <button class="button" onclick="createNewMatter()" style="background: #28a745; font-size: 12px; padding: 5px 15px;">Create</button>
                        <button class="button" onclick="toggleNewMatterForm()" style="background: #6c757d; font-size: 12px; padding: 5px 15px;">Cancel</button>
                    </div>
                </div>
                
                <!-- Document Type Selection -->
                <div>
                    <label style="font-weight: bold; font-size: 12px;">Document Type:</label>
                    <select id="document-type" style="width: 100%; padding: 6px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="Email">Email</option>
                        <option value="Contract">Contract</option>
                        <option value="Report">Report</option>
                        <option value="Correspondence">Correspondence</option>
                        <option value="Legal Brief">Legal Brief</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <button class="button" onclick="saveEmail()">Save Email</button>
                <button class="button" onclick="saveSelectedAttachments()">Save Selected Attachments</button>
                
                <div id="status-message" style="margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 4px; display: none;"></div>
            </div>
            
            <!-- Recent Documents -->
            <div style="margin-top: 20px;">
                <h3>Recent Documents</h3>
                <div id="recent-documents" style="max-height: 150px; overflow-y: auto;"></div>
            </div>
            
            <div style="margin-top: 20px;">
                <a class="button" target="_blank" rel="noopener" href="/matters">Open MatterDocs</a>
            </div>
        </div>
    </main>
    
    <script>
        let currentEmail = {};
        let attachments = [];
        let allMatters = [];
        let selectedMatterId = null;
        
        Office.onReady((info) => {
            console.log('Office.js ready:', info);
            if (info.host === Office.HostType.Outlook) {
                setTimeout(() => {
                    loadEmailInfo();
                    loadMatters();
                    loadRecentDocuments();
                }, 500);
            } else {
                document.getElementById('loading').textContent = 'Not running in Outlook';
            }
        });
        
        function loadEmailInfo() {
            try {
                const item = Office.context.mailbox.item;
                console.log('Item:', item);
                
                // Get subject (synchronous property)
                const subject = item.subject || 'No subject';
                document.getElementById('email-subject').textContent = subject;
                currentEmail.subject = subject;
                
                // Get from (synchronous property)
                const from = item.from ? (item.from.displayName + ' <' + item.from.emailAddress + '>') : 'Unknown sender';
                document.getElementById('email-from').textContent = from;
                currentEmail.from = from;
                
                // Get date (synchronous property)
                const date = item.dateTimeCreated ? new Date(item.dateTimeCreated).toLocaleString() : 'Unknown date';
                document.getElementById('email-date').textContent = date;
                currentEmail.date = date;
                
                loadAttachments();
                
            } catch (error) {
                console.error('Error loading email info:', error);
                document.getElementById('loading').textContent = 'Error loading email: ' + error.message;
            }
        }
        
        function loadAttachments() {
            try {
                const item = Office.context.mailbox.item;
                attachments = item.attachments || [];
                
                console.log('Attachments found:', attachments.length);
                
                document.getElementById('attachment-count').textContent = attachments.length;
                
                const container = document.getElementById('attachments-container');
                container.innerHTML = '';
                
                if (attachments.length === 0) {
                    container.innerHTML = '<div class="attachment-item">No attachments found</div>';
                } else {
                    attachments.forEach((attachment, index) => {
                        const div = document.createElement('div');
                        div.className = 'attachment-item';
                        div.innerHTML = `
                            <input type="checkbox" id="att-${index}" checked>
                            <label for="att-${index}">
                                <strong>${attachment.name}</strong> (${formatFileSize(attachment.size || 0)})
                            </label>
                        `;
                        container.appendChild(div);
                    });
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('email-content').style.display = 'block';
                
            } catch (error) {
                console.error('Error loading attachments:', error);
                document.getElementById('loading').textContent = 'Error loading attachments: ' + error.message;
            }
        }
        
        function loadMatters() {
            fetch('/api/matters/list')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load matters');
                    }
                    return response.json();
                })
                .then(matters => {
                    allMatters = matters;
                    console.log('Loaded', matters.length, 'matters');
                })
                .catch(error => {
                    console.error('Error loading matters:', error);
                    showStatus('Error loading matters: ' + error.message, true);
                });
        }
        
        function searchMatters() {
            const query = document.getElementById('matter-search').value.toLowerCase();
            const dropdown = document.getElementById('matter-dropdown');
            
            if (query.length < 2) {
                dropdown.style.display = 'none';
                return;
            }
            
            const filtered = allMatters.filter(matter => 
                matter.client_name.toLowerCase().includes(query) || 
                matter.name.toLowerCase().includes(query)
            );
            
            dropdown.innerHTML = '';
            
            if (filtered.length === 0) {
                dropdown.innerHTML = '<div style="padding: 10px; color: #666;">No matters found</div>';
            } else {
                filtered.slice(0, 10).forEach(matter => {
                    const div = document.createElement('div');
                    div.style.cssText = 'padding: 8px; cursor: pointer; border-bottom: 1px solid #eee;';
                    div.innerHTML = `<strong>${matter.client_name}</strong><br><small>${matter.name}</small>`;
                    div.onclick = () => selectMatter(matter);
                    div.onmouseover = () => div.style.background = '#f0f0f0';
                    div.onmouseout = () => div.style.background = 'white';
                    dropdown.appendChild(div);
                });
            }
            
            dropdown.style.display = 'block';
        }
        
        function showMatterDropdown() {
            if (allMatters.length > 0) {
                searchMatters();
            }
        }
        
        function selectMatter(matter) {
            selectedMatterId = matter.id;
            document.getElementById('matter-search').value = `${matter.client_name} - ${matter.name}`;
            document.getElementById('matter-dropdown').style.display = 'none';
            console.log('Selected matter:', matter);
        }
        
        function toggleNewMatterForm() {
            const form = document.getElementById('new-matter-form');
            const isVisible = form.style.display !== 'none';
            form.style.display = isVisible ? 'none' : 'block';
            
            if (!isVisible) {
                document.getElementById('client-name').value = '';
                document.getElementById('matter-name').value = '';
            }
        }
        
        function createNewMatter() {
            const clientName = document.getElementById('client-name').value.trim();
            const matterName = document.getElementById('matter-name').value.trim();
            
            if (!clientName || !matterName) {
                showStatus('Please enter both client and matter names', true);
                return;
            }
            
            showStatus('Creating new matter...');
            
            fetch('/api/matters/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clientName: clientName,
                    matterName: matterName
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(result => {
                showStatus('Matter created successfully!');
                selectedMatterId = result.matter.id;
                document.getElementById('matter-search').value = `${clientName} - ${matterName}`;
                toggleNewMatterForm();
                loadMatters(); // Refresh matters list
            })
            .catch(error => {
                console.error('Error creating matter:', error);
                showStatus('Error creating matter: ' + error.message, true);
            });
        }
        
        function loadRecentDocuments() {
            fetch('/api/documents/recent')
                .then(response => response.json())
                .then(documents => {
                    const container = document.getElementById('recent-documents');
                    container.innerHTML = '';
                    
                    if (documents.length === 0) {
                        container.innerHTML = '<div style="padding: 10px; color: #666; font-size: 12px;">No recent documents</div>';
                        return;
                    }
                    
                    documents.slice(0, 5).forEach(doc => {
                        const div = document.createElement('div');
                        div.style.cssText = 'padding: 8px; border-bottom: 1px solid #eee; font-size: 12px;';
                        div.innerHTML = `
                            <strong>${doc.title}</strong><br>
                            <small style="color: #666;">${doc.client_name} - ${doc.matter_name}</small><br>
                            <small style="color: #999;">${new Date(doc.created_at).toLocaleDateString()}</small>
                        `;
                        container.appendChild(div);
                    });
                })
                .catch(error => {
                    console.error('Error loading recent documents:', error);
                });
        }
        
        function showStatus(message, isError = false) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
            statusDiv.style.background = isError ? '#ffebee' : '#e8f5e8';
            statusDiv.style.color = isError ? '#c62828' : '#2e7d32';
            console.log(message);
        }
        
        function saveEmail() {
            console.log('saveEmail clicked');
            const matterId = selectedMatterId;
            const documentType = document.getElementById('document-type').value;
            console.log('Selected matter ID:', matterId, 'Document type:', documentType);
            
            if (!matterId) {
                showStatus('Please select a matter first', true);
                return;
            }
            
            showStatus('Starting to save email...');
            
            try {
                console.log('Getting email body...');
                Office.context.mailbox.item.body.getAsync(Office.CoercionType.Text, (result) => {
                    console.log('Body result:', result);
                    if (result.status === Office.AsyncResultStatus.Succeeded) {
                        const emailData = {
                            ...currentEmail,
                            body: result.value || 'No body content',
                            matterId: matterId,
                            documentType: documentType
                        };
                        
                        console.log('Sending email data:', emailData);
                        showStatus('Saving email to server...');
                        
                        fetch('/api/email/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(emailData)
                        })
                        .then(response => {
                            console.log('Response status:', response.status);
                            if (!response.ok) {
                                throw new Error(`HTTP ${response.status}`);
                            }
                            return response.json();
                        })
                        .then(result => {
                            console.log('Save result:', result);
                            showStatus('Email saved successfully!');
                        })
                        .catch(error => {
                            console.error('Error saving email:', error);
                            showStatus('Error saving email: ' + error.message, true);
                        });
                    } else {
                        console.error('Failed to get email body:', result.error);
                        showStatus('Failed to get email content: ' + (result.error ? result.error.message : 'Unknown error'), true);
                    }
                });
            } catch (error) {
                console.error('Error in saveEmail:', error);
                showStatus('Error: ' + error.message, true);
            }
        }
        
        function saveSelectedAttachments() {
            console.log('saveSelectedAttachments clicked');
            const matterId = selectedMatterId;
            const documentType = document.getElementById('document-type').value;
            console.log('Selected matter ID:', matterId, 'Document type:', documentType);
            
            if (!matterId) {
                showStatus('Please select a matter first', true);
                return;
            }
            
            const selectedAttachments = [];
            attachments.forEach((attachment, index) => {
                const checkbox = document.getElementById(`att-${index}`);
                if (checkbox && checkbox.checked) {
                    selectedAttachments.push(attachment);
                }
            });
            
            console.log('Selected attachments:', selectedAttachments);
            
            if (selectedAttachments.length === 0) {
                showStatus('Please select at least one attachment', true);
                return;
            }
            
            showStatus(`Processing ${selectedAttachments.length} attachment(s)...`);
            
            let savedCount = 0;
            
            // Process each attachment
            selectedAttachments.forEach((attachment, index) => {
                console.log('Processing attachment:', attachment.name);
                try {
                    Office.context.mailbox.item.getAttachmentContentAsync(attachment.id, (result) => {
                        console.log('Attachment content result:', result);
                        if (result.status === Office.AsyncResultStatus.Succeeded) {
                            const attachmentData = {
                                name: attachment.name,
                                content: result.value.content,
                                contentType: result.value.format,
                                matterId: matterId,
                                documentType: documentType
                            };
                            
                            console.log('Sending attachment data for:', attachment.name);
                            
                            fetch('/api/attachments/save', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(attachmentData)
                            })
                            .then(response => {
                                console.log('Attachment response status:', response.status);
                                if (!response.ok) {
                                    throw new Error(`HTTP ${response.status}`);
                                }
                                return response.json();
                            })
                            .then(result => {
                                console.log('Attachment saved:', attachment.name, result);
                                savedCount++;
                                if (savedCount === selectedAttachments.length) {
                                    showStatus('All attachments saved successfully!');
                                }
                            })
                            .catch(error => {
                                console.error('Error saving attachment:', error);
                                showStatus('Error saving attachment ' + attachment.name + ': ' + error.message, true);
                            });
                        } else {
                            console.error('Failed to get attachment content:', result.error);
                            showStatus('Failed to get attachment: ' + attachment.name + ' - ' + (result.error ? result.error.message : 'Unknown error'), true);
                        }
                    });
                } catch (error) {
                    console.error('Error processing attachment:', error);
                    showStatus('Error processing attachment ' + attachment.name + ': ' + error.message, true);
                }
            });
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
